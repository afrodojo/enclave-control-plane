name: Sync Research & Drafts to Hive Website

on:
  push:
    paths:
      - 'docs/research/*.md'
      - 'docs/drafts/*.json'
    branches:
      - main

jobs:
  sync-research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Control Plane Repo
        uses: actions/checkout@v4

      - name: Sync Research Logs to Hive Repo
        uses: dmnemec/copy_file_action@main
        with:
          personal_token: ${{ secrets.HIVE_SYNC_TOKEN }}
          src: 'docs/research/'
          dst_owner: 'afrodojo'
          dst_repo_name: 'hive-eds-360'
          dst_path: 'docs/'
          commit_message: 'feat(cms): sync ecosystem research log'

      - name: Sync Staging Drafts to Hive Drafts Queue
        uses: dmnemec/copy_file_action@main
        with:
          personal_token: ${{ secrets.HIVE_SYNC_TOKEN }}
          src: 'docs/drafts/'
          dst_owner: 'afrodojo'
          dst_repo_name: 'hive-eds-360'
          dst_path: 'content/drafts/'
          commit_message: 'feat(cms): sync staging draft to admin queue'
