name: Sync Feeds and Research to Hive Website

on:
  push:
    paths:
      - 'docs/research/*.md'
      - 'docs/feeds/*.json'
    branches:
      - main

jobs:
  sync-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Control Plane Repo
        uses: actions/checkout@v4

      - name: Copy Research Logs
        uses: dmnemec/copy_file_action@main
        with:
          personal_token: ${{ secrets.HIVE_SYNC_TOKEN }}
          src: 'docs/research/'
          dst_owner: 'afrodojo'
          dst_repo_name: 'hive-eds-360'
          dst_path: 'docs/'
          commit_message: 'feat(cms): sync research log'

      - name: Copy Dashboard Feeds
        uses: dmnemec/copy_file_action@main
        with:
          personal_token: ${{ secrets.HIVE_SYNC_TOKEN }}
          src: 'docs/feeds/'
          dst_owner: 'afrodojo'
          dst_repo_name: 'hive-eds-360'
          dst_path: 'docs/feeds/'
          commit_message: 'feat(cms): sync lab status and SIEM feeds'
