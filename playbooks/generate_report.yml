---
- name: Collect Cluster Health Telemetry
  hosts: enclave
  gather_facts: yes
  tasks:
    - name: Query Service Statuses
      command: systemctl is-active {{ item }}
      register: service_status
      ignore_errors: yes
      loop:
        - nginx
        - ollama
        - firewalld

    - name: Ensure reports directory exists on Node 0
      delegate_to: localhost
      run_once: true
      file:
        path: /root/repo/enclave-control-plane/reports
        state: directory
        mode: '0755'

    - name: Output JSON Status Artifact
      delegate_to: localhost
      copy:
        content: "{{ ansible_facts | to_nice_json }}"
        dest: "/root/repo/enclave-control-plane/reports/telemetry-{{ inventory_hostname }}.json"
